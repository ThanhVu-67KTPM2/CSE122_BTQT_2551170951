<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 30 - Bảng điều khiển Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style30.css">
</head>
<body>

    <div class="d-flex min-vh-100 bg-page">
        
        <aside class="sidebar-custom p-3">
            <h5 class="fw-bold text-white mb-4 px-2 mt-2">CSE.TLU Admin</h5>
            <ul class="nav flex-column gap-1">
                <li class="nav-item">
                    <a href="#" class="nav-link text-white active rounded">Bảng điều khiển</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white rounded opacity-75">Bài tập</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white rounded opacity-75">Sinh viên</a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link text-white rounded opacity-75">Điểm số</a>
                </li>
            </ul>
        </aside>

        <main class="flex-grow-1 p-4 p-md-5 overflow-auto">
            
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <h3 class="fw-bold mb-0 text-dark">Bảng điều khiển</h3>
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-warning text-dark px-3 py-2 rounded-pill">3 bài mới</span>
                    <button class="btn btn-primary btn-sm px-3 py-2 fw-medium rounded">Xuất báo cáo</button>
                </div>
            </div>

            <div class="row g-3 mb-4">
                
                <div class="col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3 rounded-3">
                        <div class="text-secondary small fw-medium mb-1">Sinh viên</div>
                        <div class="fs-3 fw-bold text-dark mb-3">128</div>
                        <div class="progress custom-progress mt-auto">
                            <div class="progress-bar bg-primary" style="width: 65%"></div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3 rounded-3">
                        <div class="text-secondary small fw-medium mb-1">Đã nộp</div>
                        <div class="fs-3 fw-bold text-dark mb-3">96</div>
                        <div class="progress custom-progress mt-auto">
                            <div class="progress-bar bg-success" style="width: 75%"></div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3 rounded-3">
                        <div class="text-secondary small fw-medium mb-1">Chưa nộp</div>
                        <div class="fs-3 fw-bold text-dark mb-3">32</div>
                        <div class="progress custom-progress mt-auto">
                            <div class="progress-bar bg-danger" style="width: 25%"></div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100 p-3 rounded-3">
                        <div class="text-secondary small fw-medium mb-1">Điểm TB</div>
                        <div class="fs-3 fw-bold text-dark mb-3">7.8</div>
                        <div class="progress custom-progress mt-auto">
                            <div class="progress-bar bg-warning" style="width: 78%"></div>
                        </div>
                    </div>
                </div>

            </div>

            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white border-bottom py-3 fw-bold text-dark">
                    Tiến độ theo chương
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        Chương 1 — HTML5
                        <span class="badge bg-success rounded-pill px-3">100%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        Chương 2 — JavaScript
                        <span class="badge custom-bg-cyan text-white rounded-pill px-3">82%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        Chương 3 — CSS3
                        <span class="badge custom-bg-cyan text-white rounded-pill px-3">74%</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3">
                        Chương 4 — Bootstrap 5
                        <span class="badge bg-secondary rounded-pill px-3">45%</span>
                    </li>
                </ul>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
