<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 16 - Ứng dụng To-do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style16.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 py-4">

    <div class="todo-container bg-white rounded-4 shadow-lg overflow-hidden">
        
        <div class="header-box p-4 text-white">
            <h1 class="h4 fw-bold mb-1">Danh sách việc cần làm</h1>
            <p class="mb-0 opacity-75 small">Thêm việc mới, đánh dấu hoàn thành hoặc xoá — tất cả bằng JavaScript.</p>
        </div>

        <div class="p-4">
            <div class="input-group mb-4">
                <input type="text" id="txtTask" class="form-control form-control-lg custom-input" placeholder="Nhập công việc mới...">
                <button type="button" id="btnAdd" class="btn btn-purple px-4 text-white">Thêm</button>
            </div>

            <div id="taskList" class="task-list mb-3"></div>

            <div class="text-muted small pt-2 border-top">
                <span id="lblRemaining">Còn 0 việc chưa hoàn thành</span>
            </div>
        </div>

    </div>

    <script src="js/script16.js"></script>
</body>
</html>
