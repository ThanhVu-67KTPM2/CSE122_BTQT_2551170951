<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh Hiệu ứng Hover</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style23.css">
</head>
<body class="bg-light py-5">

    <div class="container main-wrapper">
        
        <div class="text-center mb-5">
            <h1 class="fw-bold h3 mb-2">Thư viện ảnh — Hiệu ứng Hover</h1>
            <p class="text-muted small">Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </div>

        <div class="gallery-grid">
            
            <div class="gallery-item shadow-sm">
                <img src="Anh/Bai23/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long" class="gallery-img">
                <div class="overlay">
                    <span class="overlay-text">Vịnh Hạ Long</span>
                </div>
            </div>

            <div class="gallery-item shadow-sm">
                <img src="Anh/Bai23/2-son-doong.jpg" alt="Hang Sơn Đoòng" class="gallery-img">
                <div class="overlay">
                    <span class="overlay-text">Hang Sơn Đoòng</span>
                </div>
            </div>

            <div class="gallery-item shadow-sm">
                <img src="Anh/Bai23/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc" class="gallery-img">
                <div class="overlay">
                    <span class="overlay-text">Thác Bản Giốc</span>
                </div>
            </div>

            <div class="gallery-item shadow-sm">
                <img src="Anh/Bai23/4-fansipan.jpg" alt="Fansipan" class="gallery-img">
                <div class="overlay">
                    <span class="overlay-text">Fansipan</span>
                </div>
            </div>

            <div class="gallery-item shadow-sm">
                <img src="Anh/Bai23/5-mekong.jpg" alt="Đồng bằng sông Cửu Long" class="gallery-img">
                <div class="overlay">
                    <span class="overlay-text">Đồng bằng sông Cửu Long</span>
                </div>
            </div>

            <div class="gallery-item shadow-sm">
                <img src="Anh/Bai23/6-phong-nha.jpg" alt="Động Phong Nha" class="gallery-img">
                <div class="overlay">
                    <span class="overlay-text">Động Phong Nha</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
