<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên hệ với chúng tôi</title>
    <link rel="stylesheet" href="css/style10.css">
</head>
<body>
    <div class="contact-card">

        <div class="form-header">
            <div class="form-title">Liên hệ với chúng tôi</div>
            <div class="form-subtitle">
                Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.
            </div>
        </div>

        <form class="contact-form">
            <div class="form-grid">

                <div class="form-group">
                    <label for="full-name">Họ và tên</label>
                    <input type="text" id="full-name" value="Nguyễn Văn An">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" value="an.nv@tlu.edu.vn">
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" value="0987 654 321">
                </div>

                <div class="form-group">
                    <label for="subject">Chủ đề</label>
                    <select id="subject">
                        <option>Hỏi về khóa học</option>
                        <option>Hỗ trợ kỹ thuật</option>
                        <option>Góp ý</option>
                        <option>Khác</option>
                    </select>
                </div>

                <div class="form-group message-group">
                    <label for="message">Nội dung</label>
                    <textarea id="message" rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
                </div>

            </div>

            <div class="consent-row">
                <input type="checkbox" id="consent" checked>
                <label for="consent">Tôi đồng ý nhận email phản hồi.</label>
            </div>

            <div class="button-row">
                <button type="submit">Gửi liên hệ</button>
                <button type="reset">Nhập lại</button>
            </div>
        </form>

    </div>
</body>
</html>
