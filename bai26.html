<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 26 - Đăng ký CLB Lập trình Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style26.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100 bg-page">

    <div class="container custom-container">
        <div class="card shadow-sm border-0 rounded-3">
            
            <div class="card-header bg-success text-white text-center py-3 border-0 rounded-top-3">
                <h4 class="mb-0 fw-semibold">Đăng ký tham gia CLB Lập trình Web</h4>
            </div>

            <div class="card-body p-4 p-md-5">
                <form class="row g-3" action="#" method="POST">
                    
                    <div class="col-md-6">
                        <label for="hoTen" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="hoTen" placeholder="Nguyễn Văn A" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="maSV" class="form-label">Mã sinh viên</label>
                        <input type="text" class="form-control" id="maSV" placeholder="22xxxxxx" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="sv@tlu.edu.vn" required>
                    </div>

                    <div class="col-md-6">
                        <label for="sdt" class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="sdt" placeholder="09xxxxxxxx" required>
                    </div>

                    <div class="col-12">
                        <label class="form-label d-block">Trình độ</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="trinhDoCoBan" value="CoBan" checked required>
                            <label class="form-check-label" for="trinhDoCoBan">Cơ bản</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="trinhDoKha" value="Kha">
                            <label class="form-check-label" for="trinhDoKha">Khá</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="trinhDo" id="trinhDoTot" value="Tot">
                            <label class="form-check-label" for="trinhDoTot">Tốt</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="chonLop" class="form-label">Chọn lớp</label>
                        <select class="form-select" id="chonLop" required>
                            <option value="67CNTT1" selected>67CNTT1</option>
                            <option value="67CNTT2">67CNTT2</option>
                            <option value="67CNTT3">67CNTT3</option>
                        </select>
                    </div>

                    <div class="col-12 mt-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="camKet" required>
                            <label class="form-check-label" for="camKet">
                                Tôi cam kết tự làm bài và quay video OBS
                            </label>
                        </div>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-3 mt-4">
                        <button type="reset" class="btn btn-outline-secondary px-4">Nhập lại</button>
                        <button type="submit" class="btn btn-success px-4">Đăng ký</button>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
