<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Bài 6 - Bảng danh sách món ăn</title>
    <link rel="stylesheet" href="css/style6.css">
</head>

<body>
    <div class="container">
        <div class="food-title">Các món ngon Hà Nội</div>

        <div class="food-content">
            <div class="food-image">
                <img src="Bat.gif" alt="Hanoi food">
            </div>

            <div class="food-table">
                <div class="table-header">
                    <div class="number-column">STT</div>
                    <div class="name-column">Tên món ăn</div>
                </div>

                <ul class="food-items">
                    <li>
                        <div class="number-column">1</div>
                        <div class="name-column">Bánh cuốn Thanh Trì</div>
                    </li>

                    <li>
                        <div class="number-column">2</div>
                        <div class="name-column">Xôi Hà Nội</div>
                    </li>

                    <li>
                        <div class="number-column">3</div>
                        <div class="name-column">Chả cá Lã Vọng</div>
                    </li>

                    <li>
                        <div class="number-column">4</div>
                        <div class="name-column">Cháo Cóc</div>
                    </li>

                    <li>
                        <div class="number-column">5</div>
                        <div class="name-column">Bánh Gai Ninh Giang</div>
                    </li>

                    <li>
                        <div class="number-column">6</div>
                        <div class="name-column">Bún Thang Hà Nội</div>
                    </li>

                    <li>
                        <div class="number-column">7</div>
                        <div class="name-column">Canh Lăng</div>
                    </li>

                    <li>
                        <div class="number-column">8</div>
                        <div class="name-column">Vịt quay Lạng Sơn</div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
